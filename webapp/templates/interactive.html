{% extends "base.html" %}
{% block title %}Interactive Game — Tribbles Simulator{% endblock %}

{% block extra_css %}
<style>
/* ══════════════════════════════════════════════════════════════════
   Layout
══════════════════════════════════════════════════════════════════ */
.game-layout {
    display: grid;
    grid-template-columns: 1fr 316px;
    gap: 18px;
    align-items: start;
}
@media (max-width: 860px) { .game-layout { grid-template-columns: 1fr; } }
.main-col { display: flex; flex-direction: column; gap: 14px; }
.right-col { display: flex; flex-direction: column; gap: 12px; }

/* ══════════════════════════════════════════════════════════════════
   Section header shared
══════════════════════════════════════════════════════════════════ */
.sec-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--t3);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
}

/* ══════════════════════════════════════════════════════════════════
   Chain hero bar
══════════════════════════════════════════════════════════════════ */
.chain-hero {
    background: var(--s1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 28px 18px;
    display: flex;
    flex-direction: column;
    gap: 0;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    position: relative;
    overflow: hidden;
}
.chain-hero-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}
.chain-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(45,212,191,.06) 0%, transparent 70%);
    pointer-events: none;
}
.chain-center { text-align: center; flex: 1; }
.chain-round-pill {
    display: inline-block;
    padding: 3px 12px;
    background: var(--s3);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    font-size: 11px;
    font-weight: 600;
    color: var(--t2);
    text-transform: uppercase;
    letter-spacing: .8px;
    margin-bottom: 10px;
}
.chain-denom {
    font-size: 52px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -3px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
}
.chain-start {
    font-size: 28px;
    font-weight: 700;
    color: var(--t2);
}
.chain-power {
    font-size: 13px;
    color: var(--t2);
    margin-top: 4px;
    font-weight: 500;
    letter-spacing: .3px;
}
.chain-broken-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 14px;
    background: rgba(255,69,58,.15);
    border: 1px solid rgba(255,69,58,.35);
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 600;
    color: var(--red);
    margin-top: 8px;
}
.chain-side {
    min-width: 90px;
    font-size: 12px;
    color: var(--t3);
}
.chain-side.right { text-align: right; }

/* ══════════════════════════════════════════════════════════════════
   Prompt / power-choice area
══════════════════════════════════════════════════════════════════ */
.prompt-panel {
    background: linear-gradient(135deg, rgba(45,212,191,.08), rgba(45,212,191,.03));
    border: 1px solid rgba(45,212,191,.3);
    border-radius: var(--radius);
    padding: 20px 22px;
    animation: promptIn .25s var(--ease-out);
}
@keyframes promptIn {
    from { opacity:0; transform: translateY(-8px) scale(.98); }
    to   { opacity:1; transform: translateY(0)     scale(1); }
}
.prompt-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--gold);
    margin-bottom: 14px;
    line-height: 1.3;
}
.choices-row { display: flex; flex-wrap: wrap; gap: 8px; }
.choice-btn {
    padding: 9px 18px;
    background: var(--s3);
    border: 1px solid var(--border-hi);
    border-radius: var(--radius-pill);
    color: var(--t1);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .18s var(--ease-spring);
    white-space: nowrap;
    font-family: inherit;
}
.choice-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #07070d;
    transform: scale(1.04);
}
.choice-btn:active { transform: scale(.96); }
.choice-btn.skip-btn {
    background: transparent;
    border-color: var(--border);
    color: var(--t2);
    font-weight: 500;
}
.choice-btn.skip-btn:hover {
    background: var(--s2);
    border-color: var(--border-hi);
    color: var(--t1);
    transform: scale(1.02);
}

/* ══════════════════════════════════════════════════════════════════
   Hand cards
══════════════════════════════════════════════════════════════════ */
.hand-panel {
    background: var(--s1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    backdrop-filter: blur(12px);
}
.hand-area {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    min-height: 100px;
    padding-top: 2px;
}
.tribble-card {
    background: var(--s2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 12px 12px;
    min-width: 82px;
    text-align: center;
    cursor: default;
    transition: all .22s var(--ease-spring);
    position: relative;
    user-select: none;
}
.tribble-card.playable {
    border-color: var(--accent);
    background: rgba(45,212,191,.07);
    cursor: pointer;
    box-shadow: 0 0 0 1px var(--accent), 0 4px 18px rgba(45,212,191,.16);
}
.tribble-card.playable:hover {
    transform: translateY(-7px) scale(1.04);
    box-shadow: 0 0 0 1.5px var(--accent), 0 14px 32px rgba(45,212,191,.26);
    z-index: 2;
}
.tribble-card.playable:active { transform: translateY(-3px) scale(.98); }
.tribble-card .denom {
    font-size: 22px;
    font-weight: 800;
    color: var(--gold);
    letter-spacing: -1px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
}
.tribble-card .power {
    font-size: 10px;
    font-weight: 600;
    color: var(--t2);
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: .8px;
}
.playable-dot {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
}
.empty-state {
    color: var(--t3);
    font-size: 13px;
    padding: 20px 0;
    width: 100%;
    text-align: center;
}

/* ══════════════════════════════════════════════════════════════════
   Play pile
══════════════════════════════════════════════════════════════════ */
.pile-panel {
    background: var(--s1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    backdrop-filter: blur(12px);
}
.pile-area { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; }
.pile-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    background: var(--s2);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    font-size: 11px;
    font-weight: 600;
    color: var(--t2);
    transition: background .15s;
}
.pile-chip:last-child {
    background: rgba(45,212,191,.10);
    border-color: rgba(45,212,191,.3);
    color: var(--accent);
}
.pile-chip .chip-denom { color: var(--gold); }

/* ══════════════════════════════════════════════════════════════════
   Game log
══════════════════════════════════════════════════════════════════ */
.log-panel {
    background: var(--s1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    backdrop-filter: blur(12px);
}
.log-scroll {
    height: 180px;
    overflow-y: auto;
    font-family: "SF Mono", "Fira Code", "Menlo", monospace;
    font-size: 11.5px;
    line-height: 1.65;
    padding-right: 4px;
}
.log-entry { color: var(--t2); padding: 0; }
.log-entry.play         { color: var(--accent); }
.log-entry.ai_play      { color: var(--amber); }
.log-entry.goes_out     { color: var(--gold); font-weight: 700; }
.log-entry.your_turn    { color: var(--rose); font-weight: 700; }
.log-entry.poison       { color: var(--violet); }
.log-entry.skip         { color: #94a3b8; }
.log-entry.chain_broken { color: var(--red); }
.log-entry.round_start  { color: var(--accent); font-weight: 600; }
.log-entry.final_score,
.log-entry.round_end    { color: var(--gold); }
.log-entry.game_over    { color: var(--rose); font-weight: 700; }

/* ══════════════════════════════════════════════════════════════════
   Opponent Play Viewer (right panel, shown during AI animation)
══════════════════════════════════════════════════════════════════ */
#play-viewer {
    display: none;
    background: linear-gradient(160deg, rgba(14,10,40,.95), rgba(7,7,13,.97));
    border: 1px solid rgba(45,212,191,.35);
    border-radius: var(--radius-lg);
    padding: 20px 18px 18px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 0 0 1px rgba(45,212,191,.12),
                0 8px 32px rgba(0,0,0,.5),
                0 0 60px rgba(45,212,191,.06);
    animation: viewerIn .3s var(--ease-out);
    position: relative;
    overflow: hidden;
}
#play-viewer::before {
    content: '';
    position: absolute;
    top: -40px; left: -40px; right: -40px;
    height: 120px;
    background: radial-gradient(ellipse at 50% 0%, rgba(45,212,191,.1) 0%, transparent 70%);
    pointer-events: none;
}
@keyframes viewerIn {
    from { opacity:0; transform: scale(.96) translateY(-8px); }
    to   { opacity:1; transform: scale(1)   translateY(0); }
}
.pv-eyebrow {
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 3px;
}
.pv-player-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--t1);
    margin-bottom: 14px;
    letter-spacing: -.2px;
}

/* Chain context inside viewer */
.pv-chain {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 14px;
}
.pv-card-mini {
    background: var(--s2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    text-align: center;
    min-width: 60px;
    opacity: .65;
}
.pv-card-featured {
    background: rgba(45,212,191,.09);
    border: 1.5px solid var(--accent);
    border-radius: 12px;
    padding: 14px 16px;
    text-align: center;
    min-width: 80px;
    box-shadow: 0 0 20px rgba(45,212,191,.2);
    animation: cardPop .3s var(--ease-spring);
}
@keyframes cardPop {
    from { transform: scale(.85); opacity:.5; }
    to   { transform: scale(1);   opacity:1; }
}
.pvc-denom {
    font-size: 24px;
    font-weight: 800;
    color: var(--gold);
    letter-spacing: -1px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
}
.pv-card-mini .pvc-denom { font-size: 15px; }
.pvc-power {
    font-size: 10px;
    font-weight: 600;
    color: var(--t2);
    margin-top: 5px;
    text-transform: uppercase;
    letter-spacing: .7px;
}
.pv-arrow {
    font-size: 18px;
    color: rgba(45,212,191,.5);
    flex-shrink: 0;
}

/* Notice line (draw / skip / chain-broken) */
.pv-notice {
    background: rgba(251,146,60,.08);
    border: 1px solid rgba(251,146,60,.25);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--amber);
    margin-bottom: 12px;
    line-height: 1.4;
}

/* Effects */
.pv-effects {
    border-top: 1px solid var(--border);
    padding-top: 10px;
    margin-top: 4px;
    font-size: 12px;
    color: var(--t2);
    line-height: 1.65;
    min-height: 18px;
    white-space: pre-line;
}

/* Progress dots */
.pv-dots {
    display: flex;
    justify-content: center;
    gap: 5px;
    margin-top: 12px;
}
.pv-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--border-hi);
    transition: all .25s;
}
.pv-dot.on {
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    width: 14px;
    border-radius: 3px;
}

/* ══════════════════════════════════════════════════════════════════
   Player sidebar cards
══════════════════════════════════════════════════════════════════ */
.players-panel { display: flex; flex-direction: column; gap: 10px; }
.player-card {
    background: var(--s1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    backdrop-filter: blur(12px);
    transition: border-color .2s;
}
.player-card.is-human { border-color: rgba(45,212,191,.35); }
.player-card.is-human .pc-name-row { color: var(--accent); }
.pc-name-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
}
.pc-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--t1);
    letter-spacing: -.1px;
}
.pc-you-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    background: var(--accent-dim);
    color: var(--accent);
    border-radius: var(--radius-pill);
    text-transform: uppercase;
    letter-spacing: .6px;
}
.pc-score {
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
}
.pc-stats {
    font-size: 11px;
    color: var(--t3);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}
.pc-stat-item { display: flex; gap: 3px; }
.pc-stat-label { color: var(--t3); }
.pc-stat-val   { color: var(--t2); font-weight: 600; }
.pc-pile-top {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 9px;
    padding-top: 9px;
    border-top: 1px solid var(--border);
}
.pc-pile-label { font-size: 10px; color: var(--t3); text-transform: uppercase; letter-spacing: .6px; }
.pc-pile-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    background: var(--s2);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    font-size: 11px;
    font-weight: 600;
    color: var(--t2);
}
.pc-pile-chip .chip-d { color: var(--gold); }

/* ══════════════════════════════════════════════════════════════════
   Chain progress tracker
══════════════════════════════════════════════════════════════════ */
.chain-tracker {
    display: flex;
    align-items: center;
    width: 100%;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
}
.chain-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
}
.chain-node-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: 1.5px solid var(--border-hi);
    background: transparent;
    transition: all .3s;
    box-sizing: border-box;
}
.chain-node.past .chain-node-dot {
    background: rgba(45,212,191,.35);
    border-color: rgba(45,212,191,.55);
}
.chain-node.current .chain-node-dot {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 10px rgba(45,212,191,.65);
    width: 11px;
    height: 11px;
}
.chain-node-label {
    font-size: 9px;
    color: var(--t3);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    line-height: 1;
}
.chain-node.past    .chain-node-label { color: rgba(45,212,191,.6); }
.chain-node.current .chain-node-label { color: var(--accent); font-size: 10px; }
.chain-connector {
    height: 1.5px;
    flex: 1;
    background: var(--border);
    margin-bottom: 14px;
}
.chain-connector.past { background: rgba(45,212,191,.4); }

/* ══════════════════════════════════════════════════════════════════
   Round summary modal
══════════════════════════════════════════════════════════════════ */
.summary-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: overlayIn .25s ease-out;
}
@keyframes overlayIn { from { opacity:0; } to { opacity:1; } }
.summary-modal {
    background: linear-gradient(160deg, rgba(14,10,40,.98), rgba(7,7,13,.99));
    border: 1px solid var(--border-hi);
    border-radius: var(--radius-lg);
    padding: 36px 40px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 24px 80px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.05);
    animation: modalIn .32s var(--ease-out);
    text-align: center;
}
@keyframes modalIn {
    from { transform: scale(.92) translateY(14px); opacity:0; }
    to   { transform: scale(1)   translateY(0);    opacity:1; }
}
.summary-eyebrow {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
}
.summary-heading {
    font-size: 28px;
    font-weight: 800;
    color: var(--t1);
    letter-spacing: -1px;
    margin: 0 0 6px;
}
.summary-winner {
    font-size: 14px;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 24px;
}
.summary-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 28px;
    font-size: 13px;
}
.summary-table th {
    color: var(--t3);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: .8px;
    padding: 0 8px 8px;
    text-align: right;
}
.summary-table th:first-child { text-align: left; }
.summary-table td {
    padding: 8px;
    text-align: right;
    color: var(--t2);
    border-top: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
}
.summary-table td:first-child { text-align: left; font-weight: 600; color: var(--t1); }
.summary-table tr.winner-row td { color: var(--gold); font-weight: 700; }
.summary-continue-btn {
    padding: 12px 32px;
    background: var(--accent);
    border: none;
    border-radius: var(--radius-pill);
    color: #07070d;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: -.1px;
    transition: all .18s var(--ease-spring);
}
.summary-continue-btn:hover { background: #5eead4; transform: scale(1.04); }
.summary-continue-btn:active { transform: scale(.96); }

/* ══════════════════════════════════════════════════════════════════
   Replay button
══════════════════════════════════════════════════════════════════ */
.replay-btn {
    align-self: flex-start;
    padding: 6px 14px;
    background: var(--s2);
    border: 1px solid var(--border-hi);
    border-radius: var(--radius-pill);
    color: var(--t2);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: .2px;
    transition: all .18s var(--ease-spring);
}
.replay-btn:hover { background: var(--s3); border-color: var(--accent); color: var(--accent); }

/* ══════════════════════════════════════════════════════════════════
   Game-over banner
══════════════════════════════════════════════════════════════════ */
.game-over-banner {
    background: linear-gradient(135deg, rgba(45,212,191,.12), rgba(251,191,36,.08));
    border: 1px solid rgba(45,212,191,.3);
    border-radius: var(--radius-lg);
    padding: 28px 32px;
    text-align: center;
    margin-bottom: 20px;
    backdrop-filter: blur(20px);
}
.game-over-banner h2 {
    font-size: 30px;
    font-weight: 800;
    color: var(--t1);
    letter-spacing: -1px;
    margin-bottom: 16px;
}
.go-scores { display: flex; flex-direction: column; gap: 6px; }
.go-score-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    background: var(--s2);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
}
.go-score-row .name { font-weight: 600; color: var(--t1); }
.go-score-row .pts  { font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
</style>
{% endblock %}

{% block content %}
<div id="game-container">
    <div class="card" style="text-align:center;padding:48px">
        <div style="font-size:15px;color:var(--t2)">Loading game…</div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const gameId = "{{ game_id }}";
let animating = false;
let lastAiMoments = [];
let lastAiState   = null;

/* ── Fetch ─────────────────────────────────────────────────────── */
function fetchState() {
    fetch(`/api/interactive/${gameId}/state`)
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                document.getElementById('game-container').innerHTML =
                    '<div class="card" style="text-align:center;padding:48px;color:var(--t2)">Game not found.</div>';
                return;
            }
            render(data);
        })
        .catch(() => setTimeout(fetchState, 2000));
}

/* ── Submit a card or choice ───────────────────────────────────── */
function playCard(cardIndex) {
    if (animating) return;
    fetch(`/api/interactive/${gameId}/play`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({card_index: cardIndex}),
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) { render(data); return; }
        const pauseModes = new Set(['power_choice','roll_mulligan','bah_choice']);
        if (pauseModes.has(data.input_mode)) { render(data); return; }
        const events  = data.events_since_human_play || [];
        const moments = buildMoments(events);
        const hasRoundEnd = events.some(e => e.type === 'round_end');

        if (moments.length) {
            lastAiMoments = moments;
            lastAiState   = data;
        }

        const afterAnim = () => {
            render(data);
            if (hasRoundEnd) showRoundSummary(data, events);
        };

        if (!moments.length) { afterAnim(); return; }
        animateMoments(moments, data, afterAnim);
    });
}

/* ── Build moment list from event stream ───────────────────────── */
const NOTICE_T  = new Set(['draw','chain_broken','skip','decked']);
const EFFECT_T  = new Set(['info','poison','goes_out','round_end','round_start','final_score','game_over']);
const SKIP_T    = new Set(['status','your_turn']);

function buildMoments(events) {
    const moments = [];
    let cur = null;
    for (const e of events) {
        if (SKIP_T.has(e.type)) continue;
        if (e.type === 'ai_play') {
            if (cur) moments.push(cur);
            cur = { kind:'play', ev:e, effects:[] };
        } else if (NOTICE_T.has(e.type)) {
            if (cur && cur.kind === 'play') { cur.effects.push(e); }
            else { if (cur) moments.push(cur); cur = { kind:'notice', ev:e, effects:[] }; }
        } else if (EFFECT_T.has(e.type)) {
            if (cur) cur.effects.push(e);
            else { cur = { kind:'notice', ev:e, effects:[] }; }
        }
    }
    if (cur) moments.push(cur);
    return moments;
}

function parsePlay(msg) {
    const m = msg.match(/^(.+?) plays (\S+)\s+(.+)$/);
    return m ? { player:m[1], denom:m[2], power:m[3] } : null;
}

/* ── Show one moment in the viewer ────────────────────────────── */
function showMoment(moment, lastCard, idx, total) {
    const vw = document.getElementById('play-viewer');

    const chainEl    = document.getElementById('pv-chain');
    const prevWrap   = document.getElementById('pv-prev-wrap');
    const arrowEl    = document.getElementById('pv-arrow');
    const noticeEl   = document.getElementById('pv-notice');
    const effectsEl  = document.getElementById('pv-effects');
    const eyebrow    = document.getElementById('pv-eyebrow');
    const nameEl     = document.getElementById('pv-player-name');

    if (moment.kind === 'play') {
        const p = parsePlay(moment.ev.message);
        if (!p) return lastCard;

        eyebrow.textContent = 'Opponent plays';
        nameEl.textContent  = p.player;

        // Prev card context
        if (lastCard) {
            document.getElementById('pv-prev-denom').textContent = lastCard.denomination;
            document.getElementById('pv-prev-power').textContent = lastCard.power;
            prevWrap.style.display = '';
            arrowEl.style.display  = '';
        } else {
            prevWrap.style.display = 'none';
            arrowEl.style.display  = 'none';
        }
        document.getElementById('pv-feat-denom').textContent = p.denom;
        document.getElementById('pv-feat-power').textContent = p.power;
        chainEl.style.display  = 'flex';
        noticeEl.style.display = 'none';

        const effectText = (moment.effects || []).map(e => e.message.trim()).join('\n');
        effectsEl.textContent = effectText;
        effectsEl.style.display = effectText ? '' : 'none';

        renderDots(idx, total);
        vw.style.display = 'block';
        return { denomination: p.denom, power: p.power };

    } else {
        eyebrow.textContent = '';
        nameEl.textContent  = '';
        chainEl.style.display  = 'none';
        noticeEl.textContent   = moment.ev.message;
        noticeEl.style.display = '';
        const effectText = (moment.effects || []).map(e => e.message.trim()).join('\n');
        effectsEl.textContent = effectText;
        effectsEl.style.display = effectText ? '' : 'none';
        renderDots(idx, total);
        vw.style.display = 'block';
        return lastCard;
    }
}

function renderDots(active, total) {
    const el = document.getElementById('pv-dots');
    if (total <= 1) { el.innerHTML = ''; return; }
    el.innerHTML = Array.from({length:total}, (_,i) =>
        `<div class="pv-dot${i===active?' on':''}"></div>`
    ).join('');
}

function hideViewer() { document.getElementById('play-viewer').style.display = 'none'; }

/* ── Animate all moments, then call onDone (defaults to render) ── */
function animateMoments(moments, state, onDone) {
    const done = onDone || (() => render(state));
    if (!moments.length) { done(); return; }
    animating = true;
    let i = 0;
    let lastCard = state.chain_before_ai || null;
    function next() {
        if (i >= moments.length) { hideViewer(); animating = false; done(); return; }
        const m = moments[i];
        lastCard = showMoment(m, lastCard, i, moments.length);
        i++;
        setTimeout(next, m.kind === 'play' ? 3000 : 1600);
    }
    next();
}

/* ── Replay the last AI animation ─────────────────────────────── */
function replayLastAiTurn() {
    if (animating || !lastAiMoments.length) return;
    animateMoments(lastAiMoments, lastAiState, () => render(lastAiState));
}

/* ── Chain progress tracker HTML ──────────────────────────────── */
function renderChainTracker(lastCard) {
    const DENOMS = [1, 10, 100, 1000, 10000, 100000];
    const LABELS = ['1', '10', '100', '1K', '10K', '100K'];
    const curDenom = lastCard ? Number(lastCard.denomination) : null;
    const curIdx   = curDenom !== null ? DENOMS.indexOf(curDenom) : -1;

    let html = '<div class="chain-tracker">';
    DENOMS.forEach((d, i) => {
        const cls = i === curIdx ? 'current' : (curIdx >= 0 && i < curIdx ? 'past' : 'future');
        html += `<div class="chain-node ${cls}">
            <div class="chain-node-dot"></div>
            <div class="chain-node-label">${LABELS[i]}</div>
        </div>`;
        // connector after each node
        const connPast = curIdx > i;
        html += `<div class="chain-connector${connPast ? ' past' : ''}"></div>`;
    });
    // Wrap-around indicator
    html += `<div class="chain-node future">
        <div class="chain-node-dot" style="border-style:dashed;opacity:.5"></div>
        <div class="chain-node-label" style="opacity:.5">↺</div>
    </div>`;
    html += '</div>';
    return html;
}

/* ── Round / game summary modal ───────────────────────────────── */
function showRoundSummary(state, events) {
    const roundEndEv = events.find(e => e.type === 'round_end');
    if (!roundEndEv) return;

    const m = roundEndEv.message.match(/Round (\d+) winner: (.+?) \(score: ([\d,]+)\)/);
    if (!m) return;
    const completedRound = parseInt(m[1]);
    const winnerName     = m[2];
    const roundKey       = 'round' + completedRound;
    const isLastRound    = state.game_over;

    const sortedPlayers = [...(state.players || [])].sort((a, b) => b.score - a.score);
    const rows = sortedPlayers.map(p => {
        const rs  = (p.round_scores && p.round_scores[roundKey]) || 0;
        const win = p.name === winnerName;
        return `<tr class="${win ? 'winner-row' : ''}">
            <td>${win ? '★ ' : ''}${p.name}${p.is_human ? ' (You)' : ''}</td>
            <td>${rs.toLocaleString()}</td>
            <td>${p.score.toLocaleString()}</td>
        </tr>`;
    }).join('');

    const contLabel = isLastRound
        ? 'View Final Results'
        : `Continue to Round ${completedRound + 1}`;

    const overlay = document.createElement('div');
    overlay.className = 'summary-overlay';
    overlay.id = 'round-summary-overlay';
    overlay.innerHTML = `
        <div class="summary-modal">
            <div class="summary-eyebrow">${isLastRound ? 'Final Round' : 'Round ' + completedRound}</div>
            <div class="summary-heading">${isLastRound ? 'Game Complete' : 'Round Complete'}</div>
            <div class="summary-winner">${winnerName} goes out!</div>
            <table class="summary-table">
                <thead><tr>
                    <th>Player</th>
                    <th>Round ${completedRound}</th>
                    <th>Total</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
            <button class="summary-continue-btn"
                    onclick="document.getElementById('round-summary-overlay').remove()">
                ${contLabel}
            </button>
        </div>`;
    document.body.appendChild(overlay);
}

/* ── Full render ───────────────────────────────────────────────── */
function render(state) {
    let html = '';

    /* Game-over banner */
    if (state.game_over) {
        const sorted = [...(state.players||[])].sort((a,b) => b.score - a.score);
        html += '<div class="game-over-banner">';
        html += '<h2>Game Over</h2>';
        html += '<div class="go-scores">';
        sorted.forEach((p,i) => {
            const medal = i===0 ? '🥇 ' : i===1 ? '🥈 ' : i===2 ? '🥉 ' : '';
            html += `<div class="go-score-row">
                <span class="name">${medal}${p.name}</span>
                <span class="pts">${p.score.toLocaleString()} pts</span>
            </div>`;
        });
        html += '</div></div>';
    }

    html += '<div class="game-layout">';

    /* ─── Left column ─────────────────────────────────────────── */
    html += '<div class="main-col">';

    /* Chain hero */
    html += '<div class="chain-hero">';
    html += '<div class="chain-hero-row">';
    html += '<div class="chain-side">';
    if (state.chain_broken) {
        html += '<span class="chain-broken-pill">⚡ Chain Broken</span>';
    }
    html += '</div>';
    html += '<div class="chain-center">';
    html += `<div class="chain-round-pill">Round ${state.round}${state.num_rounds ? ' / ' + state.num_rounds : ''}</div>`;
    if (state.last_card) {
        html += `<div class="chain-denom">${state.last_card.denomination}</div>`;
        html += `<div class="chain-power">${state.last_card.power}</div>`;
    } else {
        html += '<div class="chain-start">—</div>';
        html += '<div class="chain-power">Play a 1 to start the chain</div>';
    }
    html += '</div>';
    html += '<div class="chain-side right"></div>';
    html += '</div>'; /* end chain-hero-row */
    html += renderChainTracker(state.last_card);
    html += '</div>'; /* end chain-hero */

    /* Prompt */
    if (state.waiting_for_input && !state.game_over) {
        html += '<div class="prompt-panel">';
        html += `<div class="prompt-title">${state.input_prompt}</div>`;
        html += '<div class="choices-row">';
        (state.input_choices || []).forEach(c => {
            const isSkip = c.index === -1;
            html += `<button class="choice-btn${isSkip?' skip-btn':''}"
                             onclick="playCard(${c.index})">${c.label}</button>`;
        });
        html += '</div></div>';
    }

    /* Hand */
    const playableSet = new Set(
        (state.input_mode === 'play_card' && state.waiting_for_input)
            ? (state.input_choices||[]).map(c=>c.index)
            : []
    );
    html += '<div class="hand-panel"><div class="sec-label">Your Hand</div><div class="hand-area">';
    if (state.hand && state.hand.length) {
        state.hand.forEach((card,idx) => {
            const ok = playableSet.has(idx);
            html += `<div class="tribble-card${ok?' playable':''}"${ok?` onclick="playCard(${idx})"`:''}>`;
            if (ok) html += '<div class="playable-dot"></div>';
            html += `<div class="denom">${card.denomination}</div>`;
            html += `<div class="power">${card.power}</div>`;
            html += '</div>';
        });
    } else {
        html += '<div class="empty-state">No cards in hand</div>';
    }
    html += '</div></div>';

    /* Play pile */
    html += '<div class="pile-panel"><div class="sec-label">Your Play Pile</div><div class="pile-area">';
    if (state.play_pile && state.play_pile.length) {
        state.play_pile.forEach(c => {
            html += `<span class="pile-chip"><span class="chip-denom">${c.denomination}</span>${c.power}</span>`;
        });
    } else {
        html += '<span style="color:var(--t3);font-size:12px">Empty</span>';
    }
    html += '</div></div>';

    /* Log */
    html += '<div class="log-panel"><div class="sec-label">Game Log</div><div class="log-scroll" id="log-area">';
    (state.log||[]).forEach(e => {
        html += `<div class="log-entry ${e.type||''}">${e.message}</div>`;
    });
    html += '</div></div>';

    html += '</div>'; /* end main-col */

    /* ─── Right column ────────────────────────────────────────── */
    html += '<div class="right-col">';

    /* Replay button — only visible when there are stored AI moments */
    if (lastAiMoments.length && !animating) {
        html += `<button class="replay-btn" onclick="replayLastAiTurn()">↻ Replay Last AI Turn</button>`;
    }

    /* Play viewer (kept in DOM — shown by animation, hidden when idle) */
    html += `
    <div id="play-viewer">
        <div class="pv-eyebrow" id="pv-eyebrow">Opponent plays</div>
        <div class="pv-player-name" id="pv-player-name"></div>

        <div class="pv-chain" id="pv-chain" style="display:none">
            <div class="pv-card-mini" id="pv-prev-wrap">
                <div class="pvc-denom" id="pv-prev-denom"></div>
                <div class="pvc-power">was</div>
            </div>
            <div class="pv-arrow" id="pv-arrow">→</div>
            <div class="pv-card-featured">
                <div class="pvc-denom" id="pv-feat-denom"></div>
                <div class="pvc-power" id="pv-feat-power"></div>
            </div>
        </div>

        <div class="pv-notice" id="pv-notice" style="display:none"></div>
        <div class="pv-effects" id="pv-effects" style="display:none"></div>
        <div class="pv-dots" id="pv-dots"></div>
    </div>`;

    /* Players sidebar */
    html += '<div class="players-panel">';
    (state.players||[]).forEach(p => {
        html += `<div class="player-card${p.is_human?' is-human':''}">`;
        html += '<div class="pc-name-row">';
        html += `<span class="pc-name">${p.name}</span>`;
        if (p.is_human) {
            html += '<span class="pc-you-badge">You</span>';
        }
        html += '</div>';
        html += `<div class="pc-score">${p.score.toLocaleString()} pts</div>`;
        html += `<div class="pc-stats" style="margin-top:6px">`;
        html += `<span class="pc-stat-item"><span class="pc-stat-label">Hand</span><span class="pc-stat-val">${p.hand_count}</span></span>`;
        html += `<span class="pc-stat-item"><span class="pc-stat-label">Pile</span><span class="pc-stat-val">${p.pile_count}</span></span>`;
        html += `<span class="pc-stat-item"><span class="pc-stat-label">Deck</span><span class="pc-stat-val">${p.deck_count}</span></span>`;
        html += `<span class="pc-stat-item"><span class="pc-stat-label">Disc</span><span class="pc-stat-val">${p.discard_count}</span></span>`;
        html += '</div>';
        if (!p.is_human && p.pile_top) {
            html += `<div class="pc-pile-top">
                <span class="pc-pile-label">Top</span>
                <span class="pc-pile-chip">
                    <span class="chip-d">${p.pile_top.denomination}</span>${p.pile_top.power}
                </span>
            </div>`;
        }
        html += '</div>';
    });
    html += '</div>'; /* end players-panel */

    html += '</div>'; /* end right-col */
    html += '</div>'; /* end game-layout */

    document.getElementById('game-container').innerHTML = html;

    const logArea = document.getElementById('log-area');
    if (logArea) logArea.scrollTop = logArea.scrollHeight;
}

fetchState();
</script>
{% endblock %}
